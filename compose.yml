# Root composition. Each include is a sibling repository's own compose file: it defines its
# services; this file only puts them together and adds what belongs to no domain.
name: csp-platform

# include:
#   - path: ../csp-booking-db/deploy/compose.yml   # one line per repository the team runs

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    networks: [platform]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [platform]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    ports: ["3000:3000"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
