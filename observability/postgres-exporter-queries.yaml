# Metrics of the outbox relay of csp-worker (ADR-014, code-corhuila/csp-worker#25). They are read from the state table that the
# relay keeps in schema worker, never from schema booking or any other domain: the exporter connects as worker_app, which owns
# schema worker and has no privilege on the others. The default metrics of the exporter are turned off in compose.yml.
#
# The state table has no timestamp of when an event was discovered, so the age of the oldest pending event is measured as how late its
# next attempt is: a relay that runs keeps this at zero (an event that waits for its retry has a next attempt in the future), and a relay
# that stopped or stalled makes it grow. The publish latency of ADR-014 cannot be read here: the creation time of an event lives in the
# outbox of its domain, which the worker only reads.
worker_outbox_relay:
  query: |
    SELECT source, status, count(*)::float8 AS events
      FROM worker.outbox_relay_state
     GROUP BY source, status
  metrics:
    - source:
        usage: "LABEL"
        description: "Outbox that the relay publishes: booking, auth, concessions or ticketing_fulfillment"
    - status:
        usage: "LABEL"
        description: "PENDING, PUBLISHED, FAILED_PERMANENT or FAILED_EXHAUSTED"
    - events:
        usage: "GAUGE"
        description: "Events of the source in that status"

worker_outbox_relay_pending:
  query: |
    SELECT source,
           COALESCE(EXTRACT(EPOCH FROM now() - min(next_attempt_at) FILTER (WHERE next_attempt_at <= now())), 0)::float8 AS overdue_seconds,
           max(attempt_count)::float8 AS max_attempts
      FROM worker.outbox_relay_state
     WHERE status = 'PENDING'
     GROUP BY source
  metrics:
    - source:
        usage: "LABEL"
        description: "Outbox that the relay publishes"
    - overdue_seconds:
        usage: "GAUGE"
        description: "Seconds that the oldest pending event is past its next attempt; 0 when none is due"
    - max_attempts:
        usage: "GAUGE"
        description: "Largest number of attempts of a pending event"
