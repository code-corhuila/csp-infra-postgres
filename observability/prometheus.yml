global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts/auth-latency.yml
  - /etc/prometheus/alerts/worker-outbox-relay.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: csp-auth-api
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-api:8081"]
  # The state of the outbox relay of csp-worker, read from worker.outbox_relay_state (ADR-014).
  - job_name: csp-worker-outbox
    static_configs:
      - targets: ["postgres-exporter:9187"]
