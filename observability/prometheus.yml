global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts/auth-latency.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: csp-auth-api
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-api:8081"]
